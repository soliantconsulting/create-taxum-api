services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '3001:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_USER=dev
      - POSTGRES_DB=dev

  # Ephemeral instance for the test suite; loses all data on restart.
  postgres-test:
    image: postgres:16-alpine
    command: >-
      postgres
      -c fsync=off
      -c full_page_writes=off
      -c synchronous_commit=off
      -c wal_level=minimal
      -c max_wal_senders=0
      -c bgwriter_lru_maxpages=0
    ports:
      - '3002:5432'
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_USER=dev
      - POSTGRES_DB=dev

volumes:
  postgres-data:
